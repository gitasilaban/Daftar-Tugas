<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Individu</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <h2 style="color: #590818; text-align: center; text-decoration: underline;"><span style="font-weight: bold;">Form Biodata  </span></h2>
    <form action="#" method="post">
        <fieldset>

        <legend style="color: #590818;"><span style="font-weight: bold">Biodata</span></legend>
        <label for="name" style="color: #590818;"><span style="font-weight: bold">Nama :</span></label><br>
        <input type="text" name="Nama" id="uname" placeholder="Nama Lengkap" /><br></br>

        <label for="password" style="color: #590818;"><span style="font-weight: bold;">Password :</span></label><br>
        <input type="password" name="password" id="password" placeholder="Password"/><br></br>

        <label for="Jenis Kelamin"  style="color: #590818;"><span style="font-weight: bold;">Jenis Kelamin :</span></label><br>
        <input type="radio" id="Pria" name="gender" value="Pria"/>
        <label for="Pria">Pria</label>
        
        <input type="radio" id="Wanita" name="gender" value="Wanita"/>
        <label for="Wanita">Wanita</label><br></br>
        
        <label for="Alamat" style="color: #590818;"><span style="font-weight: bold;">Alamat :</span></label><br>
        <textarea rows="4" name="Alamat" id="Alamat" placeholder="Alamat"></textarea><br></br>

        <label for="Hobi" style="color: #590818;"><span style="font-weight: bold;">Hobi :</span></label><br>
        <input type="checkbox" id="Ngoding" name="Ngoding" Value="Ngoding" />
        <label for="Ngoding">Ngoding</label>

        <input type="checkbox" id="Mukbang" name="Mukbang" Value="Mukbang" />
        <label for="Mukbang">Mukbang</label>

        <input type="checkbox"  id="Tidur" name="Tidur" Value="Tidur" />
        <label for="Tidur">Tidur</label>

        <input type="checkbox" id="Memanjat" name="Memanjat" value="Memanjat" />
        <label for="Memanjat">Memanjat</label>

        <input type="checkbox" id="" name="Menari" value="Menari" />
        <label for="Menari">Menari</label><br></br>

        <label for="Fakultas" style="color: #590818;"><span style="font-weight: bold;">Fakultas :</span></label><br>
        <select id="Fakultas" name="Fakultas" Placeholder="Pilih Fakultas"><br>
          <option value="Fakultas Hukum">Fakultas Hukum</option>
          <option value="Fakultas Ilmu Komputer dan Teknologi Informasi">Fakultas Ilmu Komputer dan Teknologi Informasi</option>
          <option value="Fakultas Kedokteran">Fakultas Kedokteran</option>
          <option value="Fakultas Keperawatan">Fakultas Keperawatan</option>
          <option Value="Fakultas Kesehatan Masyarakat">Fakultas Kesehatan Masyarakat</option>
          <option value="Fakultas Ilmu Budaya">Fakultas Ilmu Budaya</option>
        </select><br></br>
        <button type="submit">Login</button>
        <button type="reset">Reset</button><br></br>
    </fieldset>
    </form>

</body>
</html>
